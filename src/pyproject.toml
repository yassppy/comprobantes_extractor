[project]
name = "app"
version = "0.1.0"
description = "Extracción de comprobantes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pdfplumber>=0.11.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rapidocr-onnxruntime>=1.4.4",
    "rich>=15.0.0",
    "streamlit>=1.60.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
